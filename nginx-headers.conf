# Security headers, kept in a separate file and `include`d into every location block.
#
# Lives outside conf.d so nginx does not also auto-include it at http level.
#
# This is not stylistic. nginx's add_header does NOT inherit into a location block that
# declares any add_header of its own — the child's set replaces the parent's entirely. Putting
# these at server level only would silently drop them from index.html and /assets/, both of
# which set their own Cache-Control. Including the file everywhere is what makes them apply.

# The app never talks to the network: every file the user opens is read in the browser, and
# every export is generated locally. So connect-src stays tight, which means the page has no
# way to send subject data anywhere even if something went wrong.
#
# Each relaxation below is needed by something specific, and was found by running the
# end-to-end walkthrough against this container rather than by reasoning:
#   'unsafe-eval'      — Plotly.
#   'unsafe-inline'    — Plotly's generated SVG styling and React's style attributes.
#   worker-src blob:   — the .xlsx writer compresses in a Web Worker created from a blob URL.
#                        Without this the Excel export silently fails, and only in the
#                        container: no CSP is set by the dev or preview server.
#   img-src blob:/data: — figure previews and the download anchors.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
