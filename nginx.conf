server {
    listen 8477;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Plotly is a multi-megabyte chunk; uncompressed it is a slow first load over wifi.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Vite fingerprints asset filenames, so they can be cached indefinitely: a new build
    # produces new names rather than needing a cache bust. Cache-Control is set explicitly
    # rather than via `expires`, which would emit a second, conflicting Cache-Control header.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # index.html must never be cached, or a browser keeps requesting the previous build's
    # asset filenames after a deploy and the app fails to load.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/security-headers.conf;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
